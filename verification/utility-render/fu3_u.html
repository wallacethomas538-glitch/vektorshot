<!DOCTYPE html>
<html>
<head><title>Utility render test</title><script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
<h1>Utility render test</h1>
<div id="t-bg-blue" data-test="bg-blue-500" class="bg-blue-500">blue background</div>
<div id="t-text-white" data-test="text-white" class="bg-blue-500 text-white">white text on blue</div>
<div id="t-bg-red" data-test="bg-red-500" class="bg-red-500">red background</div>
<div id="t-p4" data-test="p-4" class="p-4">padded box</div>
<div id="t-m4" data-test="m-4" class="m-4">margined box</div>
<div id="t-flex" data-test="flex" class="flex"><span>flex one</span><span>flex two</span></div>
<div id="t-grid" data-test="grid" class="grid"><span>grid one</span><span>grid two</span></div>
<div id="t-gap" data-test="gap-4" class="flex gap-4"><span>gap one</span><span>gap two</span></div>
<div id="t-text2xl" data-test="text-2xl" class="text-2xl">big text</div>
<div id="t-fontbold" data-test="font-bold" class="font-bold">bold text</div>
<div id="t-rounded" data-test="rounded-lg" class="rounded-lg bg-blue-500">rounded box</div>
<div id="t-border" data-test="border" class="border">bordered box</div>
<div id="t-shadow" data-test="shadow" class="shadow">shadowed box</div>
</body>
</html>
