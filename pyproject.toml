[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vektorshot"
version = "0.1.0"
description = "Screenshot to working HTML + Tailwind code, in the VektorFlow design system"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Wallace Joseph Thomas III" },
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["vektorshot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
